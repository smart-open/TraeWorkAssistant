[package]
name = "ai-work-assistant"
version = "3.5.7"
description = "AI Work 助手 - 多账号签到与管理桌面端"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# 单实例防护：第二进程启动时聚焦已有实例主窗口后自动退出（仅正式版注册，见 main.rs）
tauri-plugin-single-instance = "2"
# 开机自启（T11）：Windows 写注册表 Run 项
tauri-plugin-autostart = "2"
# 敏感数据加密（T4）：Stronghold 快照 + DPAPI 主密码
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
axum = "0.7"
tokio = { version = "1", features = ["sync", "io-util", "net", "rt", "rt-multi-thread", "time", "macros"] }
tokio-stream = "0.1"
bytes = "1"
sha2 = "0.10"
# 豆包 Chromium cookie v10 解密（AES-256-GCM，doubao_session 诊断/探活兜底）
aes-gcm = "0.10"
# F-70/F-78：Trae 客户端 tc 信封解密（AES-128-CBC，提取 OAuth 设备 EC P-256 私钥）
# + ExchangeToken DeviceProof 签名（ECDSA P-256/SHA-256，服务端 20405 Device proof required）
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
# 读 Trae 应用的 state.vscdb（SQLite）——自动发现当前登录账号的 Cloud-IDE uid
rusqlite = { version = "0.32", features = ["bundled"] }
# device_proxy Rust 化（P4）：以 hyper 1.x 协议栈自建 MITM 代理（参考 hudsucker internal.rs，
# 因其非拦截 CONNECT 隧道硬编码直连、无法透传用户 VPN 上游），flate2 用于日志 gzip/deflate 解压
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "server", "server-auto", "http1", "tokio", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "logging", "tls12", "webpki-tokio"] }
tokio-rustls = { version = "0.26", features = ["logging", "tls12"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
hyper-tungstenite = "0.19"
# aws_lc_rs：KeyPair 解析需支持 PKCS#1（老版 Python CA 私钥 "BEGIN RSA PRIVATE KEY"），
# ring 后端只认 PKCS#8，会导致启动代理报「解析 CA 私钥失败: Could not parse key pair」
rcgen = { version = "0.14", features = ["x509-parser", "aws_lc_rs"] }
time = "0.3"
futures-util = "0.3"
regex = "1"
flate2 = "1"
# upstream.rs：UpstreamConnector 实现 tower::Service<Uri>（hyper legacy Client 连接器接口）
tower-service = "0.3"
webpki-roots = "0.26"
# switcher（PS 桥 Rust 化）：进程枚举/优雅关闭/TerminateProcess。
# 锁定 0.33：0.38+ 要求 rustc 1.88+，超出本项目 rust-version 1.85（0.33 MSRV 1.74）
sysinfo = "=0.33.1"
# 6 层设备标识重置随机源（machineid hex32 / deviceId 15 位数字 / MachineGuid GUID）
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# .lnk 快捷方式解析（switcher exe 发现第 3 级，替代 WScript.Shell COM）
lnk = "0.6"
# 注册表读写（HKLM MachineGuid 重置 + Uninstall 键枚举定位 exe，Microsoft 官方 crate）
windows-registry = "0.6"

# dev/test 构建对依赖开优化：Stronghold 快照加密派生等在未优化下极慢（写一次 ~100s）
[profile.dev.package."*"]
opt-level = 2

[features]
# 仅桌面端
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "ai-work-assistant"
version = "3.2.5"
description = "AI Work 助手 - 多账号签到与管理桌面端"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# 单实例防护：第二进程启动时聚焦已有实例主窗口后自动退出（仅正式版注册，见 main.rs）
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
axum = "0.7"
tokio = { version = "1", features = ["sync", "io-util", "net", "rt", "macros"] }
tokio-stream = "0.1"
bytes = "1"
sha2 = "0.10"
# 读 Trae 应用的 state.vscdb（SQLite）——自动发现当前登录账号的 Cloud-IDE uid
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
# 仅桌面端
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

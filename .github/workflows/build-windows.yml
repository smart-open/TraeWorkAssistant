name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      # portable zip：零依赖（Windows 自带 tar.exe），从 release 产物打包
      - name: Package portable zip
        run: node scripts/package_portable.mjs

      - name: Stage artifacts (release/windows)
        shell: bash
        run: |
          mkdir -p release/windows
          cp src-tauri/target/release/bundle/nsis/*.exe release/windows/
          cp src-tauri/target/release/bundle/msi/*.msi release/windows/
          cp release/*_x64_portable.zip release/windows/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-work-assistant-windows
          path: |
            release/windows/*
          if-no-files-found: error

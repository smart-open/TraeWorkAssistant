name: Build Windows EXE

on:
  push:
    branches:
      - feat/export-accounts-json
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 内嵌 Python 运行时的 ABI 依赖：构建机 Python 版本必须与
      # scripts/prepare_python_runtime.py 的 --py-version 默认值一致
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache embeddable Python zip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\TraeWorkAssistant\build-cache
          key: python-embed-3.13.12-amd64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS only)
        run: npm run tauri build -- --bundles nsis

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-work-assistant-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

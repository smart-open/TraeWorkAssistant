name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (NSIS only)
        run: npm run tauri build -- --bundles nsis

      # CI 仅构建 NSIS（无 msi），不走 rename_release.mjs（其要求 exe+msi 齐全），
      # 暂存到 release/windows/ 与 macOS CI（release/mac）产物目录约定对齐
      - name: Stage artifacts (release/windows)
        shell: bash
        run: |
          mkdir -p release/windows
          cp src-tauri/target/release/bundle/nsis/*.exe release/windows/
          cp src-tauri/target/release/*.exe release/windows/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-work-assistant-windows
          path: |
            release/windows/*.exe
          if-no-files-found: error
